<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG PDF问答系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px 40px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { font-size: 14px; opacity: 0.85; }
        .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            padding: 24px;
            margin-bottom: 20px;
        }
        .card h3 { font-size: 16px; color: #333; margin-bottom: 12px; }
        .mode-switch {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .mode-btn {
            padding: 8px 20px;
            border: 2px solid #667eea;
            border-radius: 20px;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: #667eea;
            color: white;
        }
        .mode-btn:hover { opacity: 0.85; }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus { border-color: #667eea; }
        .input-area button {
            padding: 12px 28px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .input-area button:hover { background: #5a6fd8; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .quick-questions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }
        .quick-q-btn {
            padding: 6px 14px;
            background: #f5f5ff;
            border: 1px solid #ddd;
            border-radius: 16px;
            font-size: 12px;
            cursor: pointer;
            color: #666;
            transition: all 0.2s;
        }
        .quick-q-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .loading { display: none; text-align: center; padding: 20px; color: #999; }
        .loading.show { display: block; }
        .spinner {
            display: inline-block;
            width: 24px; height: 24px;
            border: 3px solid #f0f2f5;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .result-area { display: none; }
        .result-area.show { display: block; }
        .answer-box {
            background: #f8f9ff;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
            line-height: 1.8;
            white-space: pre-wrap;
            font-size: 14px;
            color: #333;
        }
        .sources-box {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;
            padding: 12px;
            margin-top: 8px;
        }
        .sources-box summary {
            cursor: pointer;
            color: #667eea;
            font-size: 13px;
            font-weight: 500;
        }
        .source-item {
            padding: 8px;
            margin: 4px 0;
            background: #fff;
            border-radius: 6px;
            border: 1px solid #f0f0f0;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }
        .source-score {
            float: right;
            color: #999;
            font-size: 12px;
        }
        .compare-section { display: none; }
        .compare-section.show { display: block; }
        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 12px;
        }
        .compare-item {
            padding: 16px;
            border-radius: 8px;
        }
        .compare-item.rag { background: #e8f5e9; border: 1px solid #c8e6c9; }
        .compare-item.llm { background: #fff3e0; border: 1px solid #ffe0b2; }
        .compare-item h4 { font-size: 14px; margin-bottom: 8px; }
        .compare-item p { font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
        .eval-scores {
            display: flex;
            gap: 12px;
            margin: 12px 0;
        }
        .score-item {
            text-align: center;
            padding: 8px 16px;
            border-radius: 8px;
            background: #f8f9ff;
        }
        .score-item .label { font-size: 11px; color: #999; }
        .score-item .value { font-size: 18px; font-weight: bold; color: #333; }
        .llm-only-toggle {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 12px; font-size: 13px; color: #666;
        }
        .llm-only-toggle input { width: 18px; height: 18px; cursor: pointer; }
        @media (max-width: 768px) {
            .compare-grid { grid-template-columns: 1fr; }
            .input-area { flex-direction: column; }
            .header { padding: 16px 20px; }
            .header h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>📄 RAG PDF 问答系统</h1>
        <p>基于招股说明书的智能问答 · 支持RAG与纯LLM对比评估</p>
    </div>

    <div class="container">
        <!-- 问答区 -->
        <div class="card">
            <h3>💬 提问</h3>
            <div class="mode-switch">
                <button class="mode-btn active" onclick="switchMode('rag', this)">🔍 RAG 模式</button>
                <button class="mode-btn" onclick="switchMode('compare', this)">⚖️ 对比模式</button>
            </div>

            <div class="input-area">
                <input type="text" id="questionInput" placeholder="请输入您的问题，例如：公司注册资本是多少？" onkeydown="if(event.key==='Enter') askQuestion()">
                <button id="askBtn" onclick="askQuestion()">🚀 提问</button>
            </div>

            <!-- 快捷问题 -->
            <div class="quick-questions">
                <span style="font-size:12px;color:#999;padding:6px 0;">快捷提问：</span>
                <button class="quick-q-btn" onclick="quickAsk('公司注册资本是多少？')">注册资本</button>
                <button class="quick-q-btn" onclick="quickAsk('法定代表人是谁？')">法定代表人</button>
                <button class="quick-q-btn" onclick="quickAsk('公司来自军用领域的收入是多少？')">军用收入</button>
                <button class="quick-q-btn" onclick="quickAsk('公司参与制定了哪个技术标准？')">技术标准</button>
                <button class="quick-q-btn" onclick="quickAsk('电子信息行业的上游涉及哪些企业？')">上游企业</button>
                <button class="quick-q-btn" onclick="quickAsk('公司计划使用多少募集资金补充流动资金？')">募集资金</button>
            </div>

            <div class="llm-only-toggle">
                <input type="checkbox" id="llmOnlyCheck">
                <label for="llmOnlyCheck">纯LLM模式（不检索文档，仅凭模型知识回答）</label>
            </div>
        </div>

        <!-- 加载指示 -->
        <div class="loading" id="loading">
            <span class="spinner"></span>正在检索文档并生成回答...
        </div>

        <!-- 结果区 -->
        <div class="result-area" id="resultArea">
            <!-- RAG 答案 -->
            <div class="card" id="ragResultCard">
                <h3>📝 RAG 回答</h3>
                <div class="answer-box" id="ragAnswer">等待提问...</div>
                <details class="sources-box">
                    <summary>📚 查看检索来源文档（<span id="sourceCount">0</span>个片段）</summary>
                    <div id="sourcesList"></div>
                </details>
            </div>

            <!-- 对比区（纯LLM答案） -->
            <div class="card compare-section" id="compareSection">
                <h3>⚖️ RAG vs 纯LLM 对比</h3>
                <div class="compare-grid">
                    <div class="compare-item rag">
                        <h4>🔍 RAG模式回答</h4>
                        <p id="compareRag">等待...</p>
                    </div>
                    <div class="compare-item llm">
                        <h4>🤖 纯LLM模式回答</h4>
                        <p id="compareLlm">等待...</p>
                    </div>
                </div>
                <div class="eval-scores" id="evalScores">
                    <div class="score-item"><div class="label">准确率</div><div class="value" id="accScore">-</div></div>
                    <div class="score-item"><div class="label">完整性</div><div class="value" id="compScore">-</div></div>
                    <div class="score-item"><div class="label">相关性</div><div class="value" id="relScore">-</div></div>
                </div>
                <div style="margin-top:8px;font-size:13px;color:#666;" id="evalConclusion"></div>
            </div>

            <!-- 响应时间 -->
            <div class="card" style="padding:12px 24px;background:#fafafa;">
                <span style="font-size:13px;color:#999;">⏱️ 响应时间：</span>
                <span id="responseTime" style="font-size:13px;color:#333;">-</span>
            </div>
        </div>
    </div>

    <script>
        let currentMode = 'rag';

        function switchMode(mode, btn) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const compareSection = document.getElementById('compareSection');
            if (mode === 'compare') {
                compareSection.classList.add('show');
            } else {
                compareSection.classList.remove('show');
            }
        }

        function quickAsk(q) {
            document.getElementById('questionInput').value = q;
            askQuestion();
        }

        async function askQuestion() {
            const question = document.getElementById('questionInput').value.trim();
            if (!question) {
                alert('请输入问题');
                return;
            }

            const llmOnly = document.getElementById('llmOnlyCheck').checked;

            // 显示加载状态
            document.getElementById('loading').classList.add('show');
            document.getElementById('resultArea').classList.remove('show');
            document.getElementById('askBtn').disabled = true;

            try {
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        question: question,
                        compare_mode: currentMode === 'compare',
                        llm_only: llmOnly
                    })
                });

                const data = await response.json();

                // 显示结果
                document.getElementById('loading').classList.remove('show');
                document.getElementById('resultArea').classList.add('show');

                // 填充RAG回答
                document.getElementById('ragAnswer').textContent = data.rag_answer || '无回答';
                document.getElementById('responseTime').textContent = data.response_time || '-';

                // 填充来源
                const sources = data.sources || [];
                document.getElementById('sourceCount').textContent = sources.length;
                const sourcesList = document.getElementById('sourcesList');
                sourcesList.innerHTML = sources.map((s, i) =>
                    `<div class="source-item">
                        <span class="source-score">得分: ${(s.score || 0).toFixed(4)}</span>
                        <div>${s.text || ''}</div>
                    </div>`
                ).join('');

                // 对比模式
                if (data.compare) {
                    document.getElementById('compareRag').textContent = data.rag_answer || '-';
                    document.getElementById('compareLlm').textContent = data.llm_answer || '-';

                    const evalData = data.evaluation || {};
                    const ragScores = evalData.rag || {};
                    document.getElementById('accScore').textContent = ragScores.accuracy || '-';
                    document.getElementById('compScore').textContent = ragScores.completeness || '-';
                    document.getElementById('relScore').textContent = ragScores.relevance || '-';
                    document.getElementById('evalConclusion').textContent = evalData.conclusion || '';
                }

            } catch (error) {
                document.getElementById('loading').classList.remove('show');
                document.getElementById('ragAnswer').textContent = '请求失败: ' + error.message;
                document.getElementById('resultArea').classList.add('show');
            } finally {
                document.getElementById('askBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
