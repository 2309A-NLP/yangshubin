<!DOCTYPE html>
<!--
页面功能: RAG 金融问答系统 Web 聊天界面
提供问题输入、答案展示和对话历史的交互界面
-->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 视口设置，适配移动端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题 -->
    <title>RAG 金融问答系统</title>
    <style>
        /* ===== 全局样式重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 页面背景和字体 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* 主容器卡片 */
        .container {
            width: 800px;
            max-width: 95vw;
            height: 90vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        /* 顶部标题栏 */
        .header {
            background: #1a73e8;
            color: white;
            padding: 20px 24px;
            text-align: center;
        }
        .header h1 {
            font-size: 20px;
            font-weight: 600;
        }
        .header p {
            font-size: 13px;
            opacity: 0.85;
            margin-top: 4px;
        }
        /* 聊天消息区域 */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        /* 消息气泡通用样式 */
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
        }
        /* 用户消息靠右，蓝色气泡 */
        .message.user {
            align-self: flex-end;
            background: #1a73e8;
            color: white;
            border-bottom-right-radius: 4px;
        }
        /* 助手消息靠左，灰色气泡 */
        .message.assistant {
            align-self: flex-start;
            background: #e8eaf0;
            color: #333;
            border-bottom-left-radius: 4px;
        }
        /* 来源引用标记 */
        .source-tag {
            display: inline-block;
            background: #e3f2fd;
            color: #1565c0;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 8px;
        }
        /* 输入区域 */
        .input-area {
            border-top: 1px solid #e0e0e0;
            padding: 16px;
            display: flex;
            gap: 12px;
            background: #fafafa;
        }
        .input-area input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #d0d0d0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area input:focus {
            border-color: #1a73e8;
        }
        .input-area button {
            padding: 12px 24px;
            background: #1a73e8;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .input-area button:hover {
            background: #1557b0;
        }
        .input-area button:disabled {
            background: #a0c4f1;
            cursor: not-allowed;
        }
        /* 加载动画 */
        .loading {
            align-self: flex-start;
            color: #999;
            font-size: 14px;
            padding: 12px;
        }
        .loading::after {
            content: "...";
            animation: dots 1.5s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: "."; }
            33% { content: ".."; }
            66% { content: "..."; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 页面标题栏 -->
        <div class="header">
            <h1>📊 RAG 金融问答系统</h1>
            <p>基于 GraphRAG 的 CCF 年报智能问答</p>
        </div>
        <!-- 聊天消息展示区域 -->
        <div class="messages" id="messageContainer">
            <div class="message assistant">
                你好！我是金融问答助手。请提出关于 CCF 年报的问题，例如：
                "平安银行2019年的盈利增长关键因素有哪些？"
            </div>
        </div>
        <!-- 输入区域 -->
        <div class="input-area">
            <input type="text" id="questionInput" placeholder="请输入您的问题..."
                   onkeydown="if(event.key==='Enter') sendQuestion()">
            <button id="sendBtn" onclick="sendQuestion()">发送</button>
        </div>
    </div>

    <script>
        // 获取页面元素引用
        const messageContainer = document.getElementById('messageContainer');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');

        /**
         * 在聊天区域添加一条消息
         * @param {string} content - 消息文本内容
         * @param {string} role - 'user' 或 'assistant'
         */
        function addMessage(content, role) {
            // 创建消息元素
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.textContent = content;
            messageContainer.appendChild(div);
            // 自动滚动到底部
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        /**
         * 发送问题到后端问答接口
         * 使用 fetch API 异步请求，过程中禁用输入和按钮
         */
        async function sendQuestion() {
            // 获取用户输入并去除首尾空格
            const question = questionInput.value.trim();
            // 空输入不处理
            if (!question) return;

            // 清空输入框
            questionInput.value = '';
            // 在界面上显示用户问题
            addMessage(question, 'user');

            // 禁用输入和按钮，防止重复提交
            questionInput.disabled = true;
            sendBtn.disabled = true;

            // 添加加载提示
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading';
            loadingDiv.textContent = '思考中';
            messageContainer.appendChild(loadingDiv);

            try {
                // 调用后端问答 API
                const response = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: question }),
                });

                // 移除加载提示
                loadingDiv.remove();

                if (response.ok) {
                    // 解析响应 JSON
                    const data = await response.json();
                    // 显示助手回答
                    addMessage(data.answer, 'assistant');
                } else {
                    // 显示错误信息
                    const data = await response.json();
                    addMessage(`错误: ${data.error}`, 'assistant');
                }
            } catch (error) {
                // 网络异常处理
                loadingDiv.remove();
                addMessage('网络错误，请检查服务是否正常运行。', 'assistant');
            } finally {
                // 恢复输入和按钮状态
                questionInput.disabled = false;
                sendBtn.disabled = false;
                questionInput.focus();
            }
        }
    </script>
</body>
</html>
